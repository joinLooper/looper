<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>森林空地・晨間陪伴</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
    body { margin: 0; background: #202d25; color: #fffdf4; }
    .phone { --base-height: 177.6833vw; --canopy-height: 60.4123vw; --canopy-scale: 1; position: relative; width: min(100%, 480px); height: 100vh; height: 100svh; margin: auto; overflow: hidden; }
    /* Only the upper 34% of the existing canopy absorbs extra screen height.
       The lower scene and every character pixel keep their native aspect ratio. */
    .canopy { position: absolute; inset: 0 0 auto; height: var(--canopy-height); overflow: hidden; }
    .canopy img { display: block; width: 100%; height: var(--base-height); transform: scaleY(var(--canopy-scale)); transform-origin: top; }
    .stage { position: absolute; inset: auto 0 0; height: var(--base-height); }
    .scene { position: absolute; width: 100%; height: 100%; display: block; clip-path: inset(34% 0 0); }
    .topbar { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 22px); left: 24px; right: 24px; pointer-events: none; text-shadow: 0 1px 9px #213120a0; }
    .topbar h1 { font-family: "Noto Serif TC", "PMingLiU", serif; font-weight: 500; font-size: 21px; letter-spacing: .15em; margin: 0 0 6px; }
    .topbar p { margin: 0; font-size: 11px; letter-spacing: .14em; }
    .hotspot { position: absolute; border: 0; padding: 0; background: transparent; border-radius: 18px; color: #fffdf1; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; min-width: 48px; min-height: 48px; }
    .hotspot:focus-visible { outline: 2px solid #fff9dc; outline-offset: -3px; }
    .marmot { left: 25%; top: 38%; width: 39%; height: 34%; }
    .stump { left: 0; top: 62%; width: 21%; height: 14%; }
    .sprout { left: 73%; top: 60%; width: 23%; height: 14%; }
    .marker { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 11px; letter-spacing: .12em; text-shadow: 0 1px 4px #172619, 0 1px 9px #172619; }
    .marker::before { content: ""; width: 4px; height: 4px; background: #ffedbd; border-radius: 50%; box-shadow: 0 0 5px #fff0c488; }
    .marker::after { content: ""; position: absolute; inset: -7px; border-radius: 20px; background: #fff4c5; opacity: 0; pointer-events: none; }
    .hotspot.responding .marker { animation: acknowledge 700ms ease-out; }
    .hotspot.responding .marker::after { animation: shimmer 700ms ease-out; }
    @keyframes acknowledge { 35% { transform: translate(-50%, -3px); } }
    @keyframes shimmer { 30% { opacity: .22; } 100% { opacity: 0; } }
    .notice { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); left: 50%; transform: translate(-50%, 4px); width: max-content; max-width: calc(100% - 40px); padding: 8px 14px; border-radius: 12px; background: #f8f6e8ed; color: #425340; font-size: 12px; line-height: 1.5; text-align: center; box-shadow: 0 3px 14px #25321d14; opacity: 0; transition: opacity 250ms ease, transform 250ms ease; pointer-events: none; }
    .notice.visible { opacity: 1; transform: translate(-50%, 0); }
    .hint { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 25px); left: 0; right: 0; margin: 0; text-align: center; font-size: 11px; letter-spacing: .15em; text-shadow: 0 1px 7px #213120; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="phone" aria-label="第一級森林空地互動預覽">
    <div class="canopy" aria-hidden="true"><img src="scene.png" alt=""></div>
    <div class="stage">
      <img class="scene" src="scene.png" alt="柔暖晨光中的森林，左側樹樁、中央偏左的土撥鼠候選坐姿、右側獨立嫩芽。">
      <button class="hotspot stump" aria-label="樹樁・休息與知識" data-message="在樹樁旁，留一點安靜的時間。"><span class="marker" aria-hidden="true">樹樁</span></button>
      <button class="hotspot marmot" aria-label="土撥鼠・陪伴" data-message="早安，我在這裡陪你。"><span class="marker" aria-hidden="true">陪伴</span></button>
      <button class="hotspot sprout" aria-label="嫩芽・觀察與照顧" data-message="小嫩芽正在迎接今天的晨光。"><span class="marker" aria-hidden="true">嫩芽</span></button>
    </div>
    <header class="topbar"><h1>森林空地</h1><p>第一級・晨間陪伴</p></header>
    <p class="notice" role="status" aria-live="polite" aria-atomic="true"></p>
    <p class="hint">輕觸森林裡的小夥伴</p>
  </main>
  <script>
    const phone = document.querySelector('.phone');
    const layout = () => {
      const base = phone.clientWidth * 1672 / 941;
      const canopyHeight = base * .34 + Math.max(0, phone.clientHeight - base);
      phone.style.setProperty('--base-height', `${base}px`);
      phone.style.setProperty('--canopy-height', `${canopyHeight}px`);
      phone.style.setProperty('--canopy-scale', canopyHeight / (base * .34));
    };
    new ResizeObserver(layout).observe(phone);
    layout();
    let timer;
    const notice = document.querySelector('.notice');
    document.querySelectorAll('.hotspot').forEach(button => {
      button.addEventListener('click', () => {
        clearTimeout(timer);
        document.querySelectorAll('.hotspot').forEach(item => item.classList.remove('responding'));
        void button.offsetWidth;
        button.classList.add('responding');
        notice.textContent = button.dataset.message;
        notice.classList.add('visible');
        timer = setTimeout(() => { notice.classList.remove('visible'); button.classList.remove('responding'); }, 3600);
      });
    });
  </script>
</body>
</html>
