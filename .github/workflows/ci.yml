name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          LOOPER_DATABASE_PATH: ${{ runner.temp }}/looper-test.sqlite
      - name: Lint shared packages
        run: |
          pnpm --filter @looper/ui lint
          pnpm --filter @looper/types lint
          pnpm --filter @looper/config lint
          pnpm --filter @looper/utils lint
          pnpm --filter @looper/constants lint
      - name: Lint API
        shell: bash
        run: |
          set +e
          pnpm --filter @looper/api lint > api-lint.log 2>&1
          status=$?
          cat api-lint.log
          exit $status
      - name: Upload API lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-lint-log
          path: api-lint.log
      - name: Lint Web
        run: pnpm --filter @looper/web lint
      - name: Lint Admin
        run: pnpm --filter @looper/admin lint
      - name: Lint Merchant
        run: pnpm --filter @looper/merchant lint
      - run: pnpm typecheck
      - name: Start isolated PostgreSQL 17 for parity
        run: node scripts/w1b-ci-pg.mjs start
      - name: Verify baseline (API, frontend and PostgreSQL parity)
        run: pnpm test
        env:
          LOOPER_DATABASE_PATH: ${{ runner.temp }}/looper-test.sqlite
      - name: Verify async read-only mission Store slice
        run: pnpm test:async-readonly
        env:
          LOOPER_DATABASE_PATH: ${{ runner.temp }}/looper-test.sqlite
      - name: Verify async persistence foundation (15 tests)
        run: pnpm test:async-foundation
        env:
          W1C1A1_ASYNC_OUTPUT_DIR: output/w1c1a1/async-foundation
      - name: Upload async foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1c1a1-hosted-async-foundation
          path: output/w1c1a1/async-foundation
      - name: Verify MVP async infrastructure load matrix
        run: pnpm qa:async-mvp-load
        env:
          W1C1A1_LOAD_OUTPUT_DIR: output/w1c1a1/mvp-load
          W1C1A1_REQUESTS: 24
      - name: Upload MVP load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1c1a1-mvp-load
          path: output/w1c1a1/mvp-load
      - name: Build shared packages
        run: |
          pnpm --filter @looper/ui build
          pnpm --filter @looper/types build
          pnpm --filter @looper/config build
          pnpm --filter @looper/utils build
          pnpm --filter @looper/constants build
      - name: Build API
        run: pnpm --filter @looper/api build
      - name: Build Web
        run: pnpm --filter @looper/web build
      - name: Build Admin
        run: pnpm --filter @looper/admin build
      - name: Build Merchant
        run: pnpm --filter @looper/merchant build
      - name: Verify root build
        run: pnpm build
      - name: Install portable capture browser
        run: pnpm exec puppeteer browsers install chrome
      - name: Capture assembly and Unified Runtime baseline
        run: pnpm qa:capture-runtime
      - name: Upload runtime browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-evidence
          path: output/runtime_assembly_v006

      - name: Stop isolated PostgreSQL parity runtime
        if: always()
        run: node scripts/w1b-ci-pg.mjs stop
